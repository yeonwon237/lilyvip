name: Story bot

on:
  schedule:
    - cron: '0 20 * * *' # 03:00 giờ Việt Nam mỗi ngày (UTC+7)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Lệnh muốn chạy'
        required: true
        default: sweep
        type: choice
        options: [sweep, add, discover, approve]
      arg:
        description: 'Tham số cho add/discover/approve (URL, từ khóa, hoặc registry id) — bỏ trống khi chạy sweep'
        required: false
        type: string
      dryRun:
        description: 'Chạy thử, không ghi/upload gì cả'
        required: false
        default: false
        type: boolean

jobs:
  run-story-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: |
          ARGS=("$MODE")
          if [ -n "$ARG" ]; then ARGS+=("$ARG"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          npx tsx scripts/story-bot/index.ts "${ARGS[@]}"
        env:
          MODE: ${{ github.event.inputs.mode || 'sweep' }}
          ARG: ${{ github.event.inputs.arg }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          LILY_OWNER_LIBRARY_URL: https://lily-owner-library-api.nguyenyen15011998.workers.dev
